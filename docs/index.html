<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jsonptrget 1.00</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="wrap brand">
      <img src="logo.svg" alt="jsonptrget mark">
      <div>
        <h1>jsonptrget</h1>
        <p class="tag">JSON Pointer getter · version 1.00</p>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="card">
      <h2>Purpose</h2>
      <p>Read JSON from stdin and print the value at a JSON Pointer such as /a/b.</p>
      <h2>Install</h2>
      <pre><code>npm install -g jsonptrget</code></pre>
      <h2>Usage</h2>
      <pre><code>jsonptrget /a/b < data.json</code></pre>
    </section>
